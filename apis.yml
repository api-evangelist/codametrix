apis:
- name: CodaMetrix Status API
  description: >-
    Unauthenticated, publicly callable JSON status API served from CodaMetrix's own status host by
    Atlassian Statuspage (Page API v2). Exposes overall page status, the CMX-Automate / CMX Automate /
    CMX-Amplify / Analytics Dashboards component tree, incidents (all and unresolved) and scheduled
    maintenances, plus Atom and RSS incident history feeds. This is the only public, machine-readable
    API surface CodaMetrix operates; the CMX CARE platform itself is delivered through direct EHR
    integration and has no published developer API.
  humanURL: https://status.codametrix.com/api/
