aid: codametrix
name: CodaMetrix
description: >-
  CodaMetrix is a Boston-based healthcare AI company that builds CMX CARE, an autonomous medical coding
  platform that translates clinical documentation into billing and diagnostic codes without human touch.
  Spun out of Mass General Brigham's physician billing organization in 2019, the platform combines machine
  learning, deep learning and natural language processing to produce a patient-centric, longitudinal view
  of the record and code across radiology, pathology, evaluation and management, endoscopy, emergency
  medicine and surgery. It is delivered as an AWS-hosted SaaS that integrates directly into the EHR
  (Epic Toolbox member, plus Cerner, Meditech and GE) rather than as a public developer API; the only
  publicly callable surface CodaMetrix operates is the unauthenticated Atlassian Statuspage Page API on
  status.codametrix.com. The company has raised $95M across Series A and Series B and was ranked No. 1 in
  the inaugural Best in KLAS category for autonomous medical coding.
